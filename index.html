<form
  class="contact-form"
  action="https://formsubmit.co/ajax/dereglafrancisjulianderegla@gmail.com"
  method="POST">
  <input type="hidden" name="_subject" value="New FLUXION Project Inquiry" />

  <input
    type="hidden"
    name="_url"
    value="https://flugelcodex.github.io/Fluxion_Studio/" />

  <input type="hidden" name="_captcha" value="false" />

  <div class="form-row">
    <div class="form-group">
      <label for="name"> YOUR NAME </label>

      <input
        type="text"
        id="name"
        name="name"
        placeholder="John Doe"
        required />
    </div>

    <div class="form-group">
      <label for="email"> YOUR EMAIL </label>

      <input
        type="email"
        id="email"
        name="email"
        placeholder="john@example.com"
        required />
    </div>
  </div>

  <div class="form-group">
    <label for="purpose"> PROJECT TYPE </label>

    <select id="purpose" name="project_type" required>
      <option value="">Select a service</option>

      <option value="Website Design">Website Design</option>

      <option value="Website Development">Website Development</option>

      <option value="Graphic Design">Graphic Design</option>

      <option value="Branding">Branding & Visual Identity</option>

      <option value="UI / UX Design">UI / UX Design</option>

      <option value="Social Media Design">Social Media Design</option>

      <option value="Other">Other</option>
    </select>
  </div>

  <div class="form-group">
    <label for="message"> TELL US ABOUT YOUR PROJECT </label>

    <textarea
      id="message"
      name="message"
      rows="7"
      placeholder="Tell us about your project, goals, requirements, budget, or ideas..."
      required></textarea>
  </div>

  <button type="submit" class="button button-primary submit-button">
    Send Inquiry

    <span>↗</span>
  </button>

  <p class="form-note">
    Your inquiry will be sent directly to the FLUXION team.
  </p>
</form>
